# D-122 · Contrôles automatiques à chaque changement : tests, types, construction. Aucun secret nécessaire.
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Tests, types et construction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Dépendances
        run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests (domaine, boucle et droits sur base en mémoire)
        run: npm test
      - name: Construction de production, avec la commande exacte de Vercel
        # D-124 · Exécutée depuis apps/web comme sur Vercel (vercel.json, buildCommand). Sans variables Supabase,
        # le script de migration ne touche à aucune base. Vercel construit en parallèle : cette étape ne bloque pas une
        # mise en ligne, mais une erreur de commande s'y voit en clair au lieu de rester cachée dans le journal de Vercel.
        working-directory: apps/web
        run: sh -c "$(node -p "require('./vercel.json').buildCommand")"
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  bout-en-bout:
    # D-125 · Boucle coach → élève → coach dans un vrai navigateur (Chromium), serveur isolé sur données fictives.
    name: Parcours de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Dépendances
        run: npm ci
      - name: Navigateur
        run: npx playwright install --with-deps chromium
      - name: Parcours
        run: npm run test:e2e
        env:
          CI: '1'
      - name: Rapport en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-bout-en-bout
          path: |
            playwright-report/
            test-results/
          retention-days: 7
